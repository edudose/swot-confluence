# Monitor de regulación y precipitación — cuenca del río Iguazú
#
# Procedencia de cada valor:
#   verificado   -> confirmado contra fuente oficial
#   por_validar  -> deducido de fuentes secundarias; confirmar con `probe`/`discover`
#   desconocido  -> hay que resolverlo con `discover`

basin:
  name: Rio Iguaçu
  # Caja envolvente aproximada de la cuenca (nacientes cerca de Curitiba
  # hasta la desembocadura en Foz do Iguaçu). Procedencia: por_validar.
  # Para recortes finos, apuntar `polygon` a un GeoJSON de la divisoria real.
  bbox: [-54.70, -26.90, -48.80, -24.90]   # [lon_min, lat_min, lon_max, lat_max]
  polygon: null                            # p.ej. config/bacia_iguacu.geojson

# ---------------------------------------------------------------------------
# Regulación: cascada del Iguazú, de aguas arriba hacia aguas abajo
#
# El estado de cada usina se decide por el caudal que ENTRA (afluente),
# según la IO-OR.PR.IGU Rev.44. Foz do Areia y Segredo no tienen umbral de
# caudal: operan por nivel. Umbrales y tiempos de viaje: tomados del tablero
# operativo (FEWS-Yacyretá). Los tiempos de viaje pueden variar con el caudal.
# ---------------------------------------------------------------------------
plants:
  - key: foz_do_areia
    lat: -26.0094
    lon: -51.6647
    drainage_km2: 30100          # ANA, estación de barramento
    name: Foz do Areia (Gov. Bento Munhoz da Rocha Neto)
    short: Foz do Areia
    operator: COPEL
    copel_label: "FOZ DO AREIA"      # etiqueta en la página MHB (por_validar)
    ons_label: "G. B. MUNHOZ"
    ons_id: IGGBMU                  # id_reservatorio en ONS (verificado)
    order: 1
    operation: nivel
    travel_h: null                   # cabecera de la cascada

  - key: segredo
    lat: -25.7883
    lon: -52.1147
    drainage_km2: 34400          # ANA, estación de barramento
    name: Segredo (Gov. Ney Aminthas de Barros Braga)
    short: Segredo
    operator: COPEL
    copel_label: "SEGREDO"
    ons_label: "SEGREDO"
    ons_id: IGSEGR                  # id_reservatorio en ONS (verificado)
    order: 2
    operation: nivel
    travel_h: 1

  - key: salto_santiago
    lat: -25.6103
    lon: -52.6164
    drainage_km2: 43900          # ANA, estación de barramento
    name: Salto Santiago
    short: Santiago
    operator: ENGIE
    copel_label: null                # no es de COPEL: sólo vía ONS
    ons_label: "SALTO SANTIAGO"
    ons_id: IGSSAN                  # id_reservatorio en ONS (verificado)
    order: 3
    operation: caudal
    attention: 4000                  # m3/s afluente
    alert: 7000
    travel_h: null

  - key: salto_osorio
    lat: -25.5331
    lon: -53.0106
    drainage_km2: 45800          # ANA, estación de barramento
    name: Salto Osório
    short: Osório
    operator: ENGIE
    copel_label: null
    ons_label: "SALTO OSORIO"
    ons_id: IGSOSO                  # id_reservatorio en ONS (verificado)
    order: 4
    operation: caudal
    attention: 4000
    alert: 7000
    travel_h: 1

  - key: salto_caxias
    lat: -25.5419
    lon: -53.4844
    drainage_km2: 57100          # ANA, estación de barramento
    name: Salto Caxias (Gov. José Richa)
    short: Caxias
    operator: COPEL
    copel_label: "SALTO CAXIAS"
    ons_label: "SALTO CAXIAS"
    ons_id: IGSCAX                  # id_reservatorio en ONS (verificado)
    order: 5
    operation: caudal
    attention: 3000
    alert: 5000
    travel_h: 2

  - key: baixo_iguacu
    lat: -25.5042
    lon: -53.6722
    drainage_km2: 61580          # ANA, estación de barramento
    name: Baixo Iguaçu
    short: Baixo
    operator: NEOENERGIA
    copel_label: null
    ons_label: "BAIXO IGUACU"
    ons_id: IGUHBI                  # id_reservatorio en ONS (verificado)
    order: 6
    operation: caudal
    attention: 3000
    alert: 5000
    travel_h: 1

# ---------------------------------------------------------------------------
# Caudal observado en el tronco
# ---------------------------------------------------------------------------
stations:
  - key: porto_capanema
    lat: -25.5667
    lon: -53.9331
    drainage_km2: 63900          # ANA, estación de barramento
    name: Porto Capanema
    short: Capanema
    river: Rio Iguaçu
    ana_code: 65987000               # tablero operativo
    copel_label: "PORTO CAPANEMA"
    role: "Aguas arriba de las Cataratas (~70 km)"
    travel_h: 4

  - key: hotel_cataratas
    lat: -25.6831
    lon: -54.4406
    drainage_km2: 67100          # ANA, estación de barramento
    name: Hotel Cataratas
    short: Cataratas
    river: Rio Iguaçu
    # Tablero operativo. Una fuente secundaria citaba 65992502, que podría
    # ser el sensor telemétrico de la misma sección: confirmar con `discover`.
    ana_code: 65992500
    copel_label: "HOTEL CATARATAS"
    role: "Cataratas del Iguazú"
    travel_h: 11

  - key: uniao_da_vitoria
    lat: -26.2281
    lon: -51.0803
    drainage_km2: 24200          # ANA, estación de barramento
    name: União da Vitória
    short: União da Vitória
    river: Rio Iguaçu
    ana_code: 65310001               # verificado: 65310000 no devuelve datos
    copel_label: null
    role: "Referencia de alto Iguazú"
    travel_h: null

# ---------------------------------------------------------------------------
# Subcuencas: áreas incrementales por punto de control
#
# `iguacu-monitor subcuencas` las delimita a partir del modelo de elevación y
# escribe el GeoJSON; el monitor de rutina sólo lo lee. Se puede reemplazar
# por otra capa (p. ej. las subcuencas de un modelo HMS) con propiedades
# `id` y `name` por polígono.
# ---------------------------------------------------------------------------
subbasins:
  file: config/subcuencas_iguacu.geojson
  # Puntos de corte: las estructuras que regulan y los puntos de control del
  # tronco aguas abajo. União da Vitória es una estación sin regulación: su
  # cuenca queda dentro del área de Foz do Areia.
  outlets: [foz_do_areia, segredo, salto_santiago, salto_osorio,
            salto_caxias, baixo_iguacu, porto_capanema, hotel_cataratas]
  # Direcciones de flujo condicionadas de HydroSHEDS v1 (15", ~450 m). Cada
  # punto se ajusta a la celda más cercana que drena al menos `snap_min_frac`
  # de su área oficial, y recién después se compara el área obtenida con la
  # de ANA: el ajuste no fuerza el resultado de la validación.
  fdir_url: https://data.hydrosheds.org/file/hydrosheds-v1-dir/hyd_sa_dir_15s.zip
  dem_bbox: [-55.0, -27.0, -48.0, -24.0]
  snap_min_frac: 0.5
  max_area_error: 0.02     # el comando falla si algún punto se aparta más de 2 %

# ---------------------------------------------------------------------------
# Lluvia medida: pluviómetros telemétricos de ANA dentro de la cuenca
#
# La lista se genera con `iguacu-monitor pluviometros`: toma del inventario
# de ANA las estaciones telemétricas operando de la subcuenca indicada que
# caen dentro de la cuenca, y conserva sólo las que reportaron lluvia en las
# últimas 48 h. Requiere la API nueva de ANA (credenciales en el entorno).
# ---------------------------------------------------------------------------
rain_gauges:
  file: config/pluviometros_iguacu.yml
  ana_bacia: 6           # Paraná
  ana_sub_bacia: 65      # Rios Paraná, Iguaçu e outros (se recorta con la cuenca)
  min_records_48h: 24    # mínimo de lecturas de lluvia para considerarla viva

# ---------------------------------------------------------------------------
# Lectura y panel
# ---------------------------------------------------------------------------
report:
  threshold_source: "IO-OR.PR.IGU Rev.44"
  # Tendencia: pendiente por mínimos cuadrados sobre las últimas horas.
  trend_window_h: 3
  # Por debajo de esta pendiente (m3/s por hora) la tendencia se muestra
  # estable (▶). Inferido del tablero operativo: +11/h estable, +16/h sube.
  trend_flat_band: 15
  sparkline_h: 48
  # Hora mostrada en el panel. Brasil sur y Argentina: UTC-3, sin horario de verano.
  display_utc_offset_h: -3
  # Estaciones que van en la fila de la cascada, en orden.
  panel_stations: [porto_capanema, hotel_cataratas]
  # Lluvia medida por los pluviómetros de ANA.
  gauge_windows_h: [1, 3, 6, 24, 72]
  gauge_min_coverage: 0.8        # fracción de lecturas esperadas en la ventana
  # Envolvente de lluvia plausible: gauge_max_1h_mm en 1 h, escalada con la
  # raíz de la duración (50 mm en 15 min, 173 mm en 3 h). Se aplica a cada
  # lectura y a las sumas móviles de 1 h y 3 h: atrapa picos de sensor y
  # rachas imposibles sin descartar un chaparrón intenso pero real.
  gauge_max_1h_mm: 100
  gauge_outlier_z: 6             # z robusto (mediana/MAD) para excluir un total aislado
  # Lluvia por subcuenca: pluviómetros interpolados (IDW) a esta grilla.
  subbasin_windows_h: [6, 24, 72]
  subbasin_grid_deg: 0.05
  # Crédito en el encabezado del monitor y al pie del cuadro de lluvia por subcuenca.
  processed_by: "Sector Hidrología / D.T EBY"

# ---------------------------------------------------------------------------
# Fuentes
# ---------------------------------------------------------------------------
sources:
  copel_mhb:
    # La página carga cada punto en un diálogo JSF dinámico que exige un rango
    # de fechas; hasta implementarlo, la regulación sale de ONS (horario).
    enabled: false
    url: "https://www.copel.com/mhbweb/paginas/bacia-iguacu.jsf"
    timeout: 60

  ana:
    enabled: true
    # auto: API nueva si ANA_HWS_USER y ANA_HWS_PASS están en el entorno,
    # servicio legacy (sin credenciales) si no. También: legacy | hidrowebservice.
    # Las credenciales van en el entorno, nunca en este archivo.
    mode: auto
    legacy_base: "https://telemetriaws1.ana.gov.br/ServiceANA.asmx"
    hws_base: "https://www.ana.gov.br/hidrowebservice"
    timeout: 90

  inpe_merge:
    enabled: true
    base: "https://ftp.cptec.inpe.br/modelos/tempo/MERGE/GPM/DAILY"
    pattern: "{base}/{yyyy}/{mm}/MERGE_CPTEC_{yyyymmdd}.grib2"
    timeout: 180

  ons:
    enabled: true
    ckan: "https://dados.ons.org.br/api/3/action/package_show"
    # Base horaria (no consistida, ~1-2 h de rezago, un archivo por mes) para
    # el monitor; la diaria consolidada queda como respaldo.
    mode: hourly
    dataset_hourly: "dados_hidrologicos_ho"
    dataset: "dados-hidrologicos-res"
    timeout: 180

store:
  path: "data/iguacu.parquet"
